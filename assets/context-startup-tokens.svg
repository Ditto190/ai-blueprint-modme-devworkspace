<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code startup context benchmark</title>
  <desc id="desc">Horizontal bars compare the maintainer's Claude Code setup without Blueprint at 44.1 thousand tokens, AI Blueprint 1.3.0 after onboarding at 52.1 thousand tokens, and AI Blueprint 1.4.0 at 45.2 thousand tokens. The same machine and global Claude configuration were used for all three measurements.</desc>
  <rect width="900" height="430" rx="24" fill="#f8fafc"/>
  <text x="48" y="56" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Fresh-session startup context</text>
  <text x="48" y="86" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Fresh session after Claude Code loads startup context. Lower is better.</text>

  <line x1="270" y1="122" x2="270" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="457" y1="122" x2="457" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="643" y1="122" x2="643" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="830" y1="122" x2="830" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="270" y="364" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="457" y="364" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">20k</text>
  <text x="643" y="364" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">40k</text>
  <text x="830" y="364" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">60k</text>

  <text x="48" y="151" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Same Claude setup</text>
  <text x="48" y="170" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">without Blueprint</text>
  <rect x="270" y="136" width="412" height="36" rx="8" fill="#94a3b8"/>
  <text x="694" y="160" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">44.1k</text>

  <text x="48" y="229" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Blueprint 1.3.0</text>
  <text x="48" y="249" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">after onboarding</text>
  <rect x="270" y="206" width="487" height="36" rx="8" fill="#f97316"/>
  <text x="769" y="230" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">52.1k</text>

  <text x="48" y="299" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Blueprint 1.4.0</text>
  <rect x="270" y="276" width="422" height="36" rx="8" fill="#2563eb"/>
  <text x="704" y="300" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">45.2k</text>

  <rect x="48" y="382" width="214" height="30" rx="15" fill="#dbeafe"/>
  <text x="155" y="402" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">13% less startup context</text>
  <text x="830" y="402" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="end">Same machine and global Claude config, 2026-09-01</text>
</svg>
