<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Compact overview startup context benchmark</title>
  <desc id="desc">Horizontal bars compare a reporter-sized 94 kilobyte project overview at 79.5 thousand startup tokens with a 4 kilobyte overview generated by the corrected Blueprint workflow at 35.7 thousand tokens.</desc>
  <rect width="900" height="430" rx="24" fill="#f8fafc"/>
  <text x="48" y="56" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Compact overview: startup context</text>
  <text x="48" y="86" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Same Opus 5 fixture and global Claude configuration. Lower is better.</text>

  <line x1="270" y1="122" x2="270" y2="318" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="410" y1="122" x2="410" y2="318" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="550" y1="122" x2="550" y2="318" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="690" y1="122" x2="690" y2="318" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="830" y1="122" x2="830" y2="318" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="270" y="342" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">0</text>
  <text x="410" y="342" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">20k</text>
  <text x="550" y="342" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">40k</text>
  <text x="690" y="342" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">60k</text>
  <text x="830" y="342" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">80k</text>

  <text x="48" y="174" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Before correction</text>
  <text x="48" y="194" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">94 KB overview</text>
  <rect x="270" y="158" width="556" height="38" rx="8" fill="#f97316"/>
  <text x="814" y="220" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">79.5k</text>

  <text x="48" y="266" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Compact overview</text>
  <text x="48" y="286" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">4 KB overview</text>
  <rect x="270" y="250" width="250" height="38" rx="8" fill="#2563eb"/>
  <text x="532" y="274" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">35.7k</text>

  <rect x="48" y="370" width="222" height="30" rx="15" fill="#dbeafe"/>
  <text x="159" y="390" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">55% less startup context</text>
  <text x="852" y="390" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="end">Claude Opus 5, 1M context, 2026-09-01</text>
</svg>
