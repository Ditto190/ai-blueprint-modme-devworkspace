<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">AI Blueprint feature implementation token benchmark</title>
  <desc id="desc">Two panels compare Blueprint 1.3.0 with Blueprint 1.4.0. Cumulative implementation input falls from 1.62 million to 1.45 million tokens. Final live context falls from 74.8 thousand to 67.3 thousand tokens.</desc>
  <rect width="900" height="500" rx="24" fill="#f8fafc"/>
  <text x="48" y="56" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Three-step feature implementation</text>
  <text x="48" y="86" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="16">Same onboarded task-tracker fixture and model. Lower is better.</text>

  <rect x="40" y="116" width="395" height="292" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="153" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Cumulative input</text>
  <text x="64" y="176" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">All model turns during implementation</text>
  <text x="64" y="224" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Blueprint 1.3.0</text>
  <rect x="64" y="238" width="318" height="34" rx="8" fill="#f97316"/>
  <text x="382" y="294" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">1.62M tokens</text>
  <text x="64" y="329" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Blueprint 1.4.0</text>
  <rect x="64" y="343" width="284" height="34" rx="8" fill="#2563eb"/>
  <text x="382" y="399" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">1.45M tokens</text>

  <rect x="465" y="116" width="395" height="292" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="489" y="153" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Final live context</text>
  <text x="489" y="176" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Context carried into the final handoff turn</text>
  <text x="489" y="224" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Blueprint 1.3.0</text>
  <rect x="489" y="238" width="291" height="34" rx="8" fill="#f97316"/>
  <text x="812" y="294" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">74.8k tokens</text>
  <text x="489" y="329" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Blueprint 1.4.0</text>
  <rect x="489" y="343" width="262" height="34" rx="8" fill="#2563eb"/>
  <text x="812" y="399" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">67.3k tokens</text>

  <rect x="48" y="432" width="208" height="30" rx="15" fill="#dbeafe"/>
  <text x="152" y="452" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">11% less cumulative input</text>
  <rect x="270" y="432" width="190" height="30" rx="15" fill="#dbeafe"/>
  <text x="365" y="452" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">10% less final context</text>
  <text x="852" y="452" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="end">Estimated list cost: $0.74 to $0.49</text>
</svg>
